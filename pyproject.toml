[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cbdownloader"
version = "0.1.0"
description = "Comic book downloader toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "CBDownloader Maintainer"}]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
web = [
    "flask>=2.3",
]
dev = [
    "pytest>=7.4",
    "responses>=0.25",
    "flask>=2.3",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
